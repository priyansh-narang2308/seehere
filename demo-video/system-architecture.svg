<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">SeeHere system architecture on Vultr</title>
<desc id="d">A lecture video, and optionally its slide deck, is prepared into audio and frames. Speech is transcribed with word timings. Slide changes become keyframes, on-screen text is read with OCR and a vision model on Vultr Serverless Inference finds charts, tables and diagrams. Seen-versus-said finds visuals that are never spoken; spoken pointers are resolved to regions. Descriptions are written from evidence only, claims are verified, a CP-SAT solver schedules them in speech pauses, Piper voices them, timing is re-checked with measured audio, an instructor reviews them, and accessible exports are built. Everything runs on one Vultr Cloud Compute instance with Docker Compose.</desc>
