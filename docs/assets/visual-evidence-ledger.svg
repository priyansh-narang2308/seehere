<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
  <title id="t">SeeHere visual evidence ledger</title>
  <desc id="d">Every spoken description links back to its sources: the visual unit, the keyframe and region, the OCR lines inside that region, the aligned slide page, and the transcript spans. Each claim in the description is checked against that evidence and gets one of four states: verified text match, corroborated, uncertain, or needs review. Cues that need review are held from the schedule until an instructor approves, edits, rejects or regenerates them; every decision is recorded.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6478"/></marker>
    <style>
      .t{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#181C26}
      .h{font-size:15px;font-weight:600}
      .s{font-size:12.5px;fill:#5B6478}
      .k{font-size:12px;font-weight:600;letter-spacing:.08em;fill:#5B6478}
      .q{font-size:14px;font-style:italic;fill:#181C26}
      .box{fill:#fff;stroke:#D5DAE3;stroke-width:1.5}
      .acc{fill:#EEF2FF;stroke:#2F5BFF;stroke-width:1.5}
      .ln{stroke:#5B6478;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <rect width="1200" height="640" fill="#FBFBFD"/>
  <text x="40" y="52" class="t" style="font-size:26px;font-weight:700">Visual evidence ledger</text>
  <text x="40" y="80" class="t s" style="font-size:13px">No description reaches a listener without a trail back to what was on screen and what was said.</text>

  <!-- Evidence column -->
  <text x="40" y="128" class="t k">EVIDENCE</text>
  <rect x="40" y="140" width="300" height="64" rx="10" class="box"/>
  <text x="58" y="166" class="t h">Keyframe + region</text>
  <text x="58" y="186" class="t s">frame at 00:41, box around the bar chart</text>
  <rect x="40" y="216" width="300" height="64" rx="10" class="box"/>
  <text x="58" y="242" class="t h">OCR lines in the region</text>
  <text x="58" y="262" class="t s">"Red 42%", "Blue 18%" with confidence</text>
  <rect x="40" y="292" width="300" height="64" rx="10" class="box"/>
  <text x="58" y="318" class="t h">Slide page (optional)</text>
  <text x="58" y="338" class="t s">deck text aligned to the keyframe</text>
  <rect x="40" y="368" width="300" height="64" rx="10" class="box"/>
  <text x="58" y="394" class="t h">Transcript spans</text>
  <text x="58" y="414" class="t s">"as you can see here" at 00:43</text>
  <rect x="40" y="444" width="300" height="64" rx="10" class="box"/>
  <text x="58" y="470" class="t h">Visual unit</text>
  <text x="58" y="490" class="t s">kind, label, values, coverage, priority</text>

  <!-- Cue -->
  <rect x="420" y="250" width="330" height="150" rx="14" class="acc"/>
  <text x="440" y="280" class="t k">DESCRIPTION CUE (EXAMPLE)</text>
  <text x="440" y="310" class="t q">"Bar chart: red light absorbed</text>
  <text x="440" y="330" class="t q">most at 42 percent, blue at 18."</text>
  <text x="440" y="362" class="t s">short · medium · long wordings,</text>
  <text x="440" y="380" class="t s">built only from the unit's fields</text>
  <path d="M340 172C385 172 380 290 414 290" class="ln" marker-end="url(#a)"/>
  <path d="M340 248C380 248 380 305 414 305" class="ln" marker-end="url(#a)"/>
  <path d="M340 324H414" class="ln" marker-end="url(#a)"/>
  <path d="M340 400C380 400 380 345 414 345" class="ln" marker-end="url(#a)"/>
  <path d="M340 476C385 476 380 365 414 365" class="ln" marker-end="url(#a)"/>

  <!-- Verification -->
  <text x="820" y="128" class="t k">EACH CLAIM IS CHECKED</text>
  <rect x="820" y="140" width="340" height="62" rx="10" fill="#E9F7EF" stroke="#2E8B57" stroke-width="1.5"/>
  <text x="838" y="166" class="t h">Verified text match</text>
  <text x="838" y="186" class="t s">quote or number found in OCR or slide text</text>
  <rect x="820" y="212" width="340" height="62" rx="10" fill="#EEF2FF" stroke="#2F5BFF" stroke-width="1.5"/>
  <text x="838" y="238" class="t h">Corroborated</text>
  <text x="838" y="258" class="t s">statement seen by the vision model only</text>
  <rect x="820" y="284" width="340" height="62" rx="10" fill="#FFF6E5" stroke="#B7791F" stroke-width="1.5"/>
  <text x="838" y="310" class="t h">Uncertain</text>
  <text x="838" y="330" class="t s">low OCR confidence or a digit-fixed match</text>
  <rect x="820" y="356" width="340" height="62" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="1.5"/>
  <text x="838" y="382" class="t h">Needs review</text>
  <text x="838" y="402" class="t s">unsupported: held from the schedule</text>
  <path d="M750 325H814" class="ln" marker-end="url(#a)"/>
  <text x="782" y="315" text-anchor="middle" class="t s">weakest</text>

  <!-- Review -->
  <rect x="420" y="470" width="740" height="120" rx="14" class="box"/>
  <text x="440" y="500" class="t k">INSTRUCTOR REVIEW</text>
  <text x="440" y="528" class="t h">Approve · Edit · Reject · Regenerate</text>
  <text x="440" y="552" class="t s">Edits are re-verified. Every decision is a stored row that survives re-generation and re-queues timing, voice and export.</text>
  <text x="440" y="572" class="t s">The ledger ships in manifest.json with file hashes. It is a check against what was visible, not proof that the lecture is correct.</text>
  <path d="M990 418V464" class="ln" marker-end="url(#a)"/>
</svg>
