<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d">
  <title id="t">SeeHere multimodal pipeline</title>
  <desc id="d">An uploaded lecture is split into audio and frames. Audio is transcribed with word timings. Frames become keyframes, then on-screen text, then visual units from OCR or a vision model; an optional slide deck adds page text. Coverage compares what is shown with what is said. References link spoken pointers to regions. Descriptions are written only from unit fields, each claim is verified against the evidence, a scheduler places descriptions in speech gaps, a voice is synthesized, timing is re-checked with measured clip lengths, and exports are built.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6478"/></marker>
    <style>
      .t{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#181C26}
      .h{font-size:15px;font-weight:600}
      .s{font-size:12.5px;fill:#5B6478}
      .k{font-size:12px;font-weight:600;letter-spacing:.08em;fill:#5B6478}
      .c{font-family:'JetBrains Mono',Menlo,Consolas,monospace;font-size:11.5px;fill:#2F5BFF}
      .box{fill:#fff;stroke:#D5DAE3;stroke-width:1.5}
      .acc{fill:#EEF2FF;stroke:#2F5BFF;stroke-width:1.5}
      .opt{fill:#F7F8FA;stroke:#B9C0CD;stroke-width:1.5;stroke-dasharray:6 4}
      .ln{stroke:#5B6478;stroke-width:1.6;fill:none}
      .dl{stroke:#5B6478;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#FBFBFD"/>
  <text x="40" y="52" class="t" style="font-size:26px;font-weight:700">Multimodal pipeline</text>
  <text x="40" y="80" class="t s" style="font-size:13px">Each box is one queued job. Two branches (hearing, seeing) meet at coverage; every later step keeps a link back to its evidence.</text>

  <!-- Input -->
  <rect x="40" y="300" width="150" height="90" rx="12" class="box"/>
  <text x="115" y="334" text-anchor="middle" class="t h">Lecture video</text>
  <text x="115" y="354" text-anchor="middle" class="t s">MP4 / MOV / MKV</text>
  <text x="115" y="372" text-anchor="middle" class="t s">≤ 30 min, ≤ 500 MB</text>

  <rect x="230" y="300" width="160" height="90" rx="12" class="box"/>
  <text x="310" y="330" text-anchor="middle" class="t h">Prepare media</text>
  <text x="310" y="349" text-anchor="middle" class="c">media.prepare</text>
  <text x="310" y="370" text-anchor="middle" class="t s">16 kHz WAV · 1 fps frames</text>
  <path d="M190 345H224" class="ln" marker-end="url(#a)"/>

  <!-- Hearing branch -->
  <text x="440" y="138" class="t k">HEARING</text>
  <rect x="440" y="150" width="200" height="86" rx="12" class="box"/>
  <text x="540" y="180" text-anchor="middle" class="t h">Transcribe speech</text>
  <text x="540" y="199" text-anchor="middle" class="c">speech.transcribe</text>
  <text x="540" y="219" text-anchor="middle" class="t s">faster-whisper, word timings</text>
  <path d="M390 325C415 325 415 193 434 193" class="ln" marker-end="url(#a)"/>

  <!-- Seeing branch -->
  <text x="440" y="292" class="t k">SEEING</text>
  <rect x="440" y="304" width="150" height="86" rx="12" class="box"/>
  <text x="515" y="334" text-anchor="middle" class="t h">Slide changes</text>
  <text x="515" y="353" text-anchor="middle" class="c">scenes.detect</text>
  <text x="515" y="373" text-anchor="middle" class="t s">keyframes, dedupe</text>
  <path d="M390 347H434" class="ln" marker-end="url(#a)"/>

  <rect x="620" y="304" width="150" height="86" rx="12" class="box"/>
  <text x="695" y="334" text-anchor="middle" class="t h">On-screen text</text>
  <text x="695" y="353" text-anchor="middle" class="c">ocr.extract</text>
  <text x="695" y="373" text-anchor="middle" class="t s">Tesseract lines + boxes</text>
  <path d="M590 347H614" class="ln" marker-end="url(#a)"/>

  <rect x="800" y="304" width="170" height="86" rx="12" class="acc"/>
  <text x="885" y="334" text-anchor="middle" class="t h">Find visuals</text>
  <text x="885" y="353" text-anchor="middle" class="c">visual.analyze</text>
  <text x="885" y="373" text-anchor="middle" class="t s">units: chart, table, …</text>
  <path d="M770 347H794" class="ln" marker-end="url(#a)"/>

  <rect x="800" y="420" width="170" height="74" rx="12" class="opt"/>
  <text x="885" y="447" text-anchor="middle" class="t h" style="font-size:14px">Vision model</text>
  <text x="885" y="466" text-anchor="middle" class="t s">Gemini or Vultr, checked</text>
  <text x="885" y="482" text-anchor="middle" class="t s">OCR-only if unavailable</text>
  <path d="M885 414V396" class="dl" marker-end="url(#a)"/>

  <rect x="620" y="420" width="150" height="74" rx="12" class="opt"/>
  <text x="695" y="447" text-anchor="middle" class="t h" style="font-size:14px">Slide deck</text>
  <text x="695" y="466" text-anchor="middle" class="c">deck.ingest</text>
  <text x="695" y="482" text-anchor="middle" class="t s">PDF / PPTX (optional)</text>
  <path d="M695 414V396" class="dl" marker-end="url(#a)"/>

  <!-- Coverage -->
  <rect x="1000" y="220" width="170" height="96" rx="12" class="acc"/>
  <text x="1085" y="252" text-anchor="middle" class="t h">Seen vs said</text>
  <text x="1085" y="271" text-anchor="middle" class="c">coverage.score</text>
  <text x="1085" y="291" text-anchor="middle" class="t s">what the speaker</text>
  <text x="1085" y="307" text-anchor="middle" class="t s">never reads aloud</text>
  <path d="M640 193H1085V214" class="ln" marker-end="url(#a)"/>
  <path d="M970 347H1085V322" class="ln" marker-end="url(#a)"/>

  <!-- Lower row, right to left -->
  <text x="280" y="560" class="t k">DESCRIBE, CHECK, PLACE, VOICE</text>
  <g>
    <rect x="1000" y="580" width="170" height="96" rx="12" class="box"/>
    <text x="1085" y="611" text-anchor="middle" class="t h">Resolve "this", "here"</text>
    <text x="1085" y="630" text-anchor="middle" class="c">references.resolve</text>
    <text x="1085" y="651" text-anchor="middle" class="t s">pointer → region</text>
    <path d="M1085 316V574" class="ln" marker-end="url(#a)"/>

    <rect x="810" y="580" width="160" height="96" rx="12" class="box"/>
    <text x="890" y="611" text-anchor="middle" class="t h">Write descriptions</text>
    <text x="890" y="630" text-anchor="middle" class="c">descriptions.generate</text>
    <text x="890" y="651" text-anchor="middle" class="t s">short · medium · long</text>
    <path d="M1000 628H976" class="ln" marker-end="url(#a)"/>

    <rect x="630" y="580" width="150" height="96" rx="12" class="acc"/>
    <text x="705" y="611" text-anchor="middle" class="t h">Verify claims</text>
    <text x="705" y="630" text-anchor="middle" class="c">claims.verify</text>
    <text x="705" y="651" text-anchor="middle" class="t s">quotes, numbers</text>
    <path d="M810 628H786" class="ln" marker-end="url(#a)"/>

    <rect x="450" y="580" width="150" height="96" rx="12" class="acc"/>
    <text x="525" y="611" text-anchor="middle" class="t h">Plan timing</text>
    <text x="525" y="630" text-anchor="middle" class="c">schedule.plan</text>
    <text x="525" y="651" text-anchor="middle" class="t s">CP-SAT vs greedy</text>
    <path d="M630 628H606" class="ln" marker-end="url(#a)"/>

    <rect x="280" y="580" width="140" height="96" rx="12" class="box"/>
    <text x="350" y="611" text-anchor="middle" class="t h">Voice</text>
    <text x="350" y="630" text-anchor="middle" class="c">speech.synthesize</text>
    <text x="350" y="651" text-anchor="middle" class="t s">Piper, measured WAV</text>
    <path d="M450 628H426" class="ln" marker-end="url(#a)"/>

    <rect x="130" y="580" width="120" height="96" rx="12" class="box"/>
    <text x="190" y="611" text-anchor="middle" class="t h">Check fit</text>
    <text x="190" y="630" text-anchor="middle" class="c">timing.check</text>
    <text x="190" y="651" text-anchor="middle" class="t s">≤ 3 rounds</text>
    <path d="M280 628H256" class="ln" marker-end="url(#a)"/>
    <path d="M190 676V706H525V682" class="dl" marker-end="url(#a)"/>
    <text x="358" y="722" text-anchor="middle" class="t s">re-plan with measured clip lengths if a clip does not fit</text>

    <rect x="40" y="440" width="150" height="96" rx="12" class="acc"/>
    <text x="115" y="471" text-anchor="middle" class="t h">Exports</text>
    <text x="115" y="490" text-anchor="middle" class="c">export.build</text>
    <text x="115" y="510" text-anchor="middle" class="t s">VTT · MP4 · WAV ·</text>
    <text x="115" y="526" text-anchor="middle" class="t s">report · manifest</text>
    <path d="M150 580V542" class="ln" marker-end="url(#a)"/>
  </g>
</svg>
