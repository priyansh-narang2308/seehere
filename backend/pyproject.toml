[project]
name = "seehere"
version = "0.1.0"
description = "SeeHere backend: evidence-grounded audio descriptions for lecture videos"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.115",
    "faster-whisper>=1.1",
    "httpx>=0.28.1",
    "pillow>=11",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
seehere-api = "seehere.api.main:run"

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# Generated migrations embed CHECK-constraint SQL as single string literals.
"migrations/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["seehere"]
mypy_path = "src"

[[tool.mypy.overrides]]
# faster-whisper ships no type information; its use is confined to stt_faster_whisper.py.
module = ["faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
